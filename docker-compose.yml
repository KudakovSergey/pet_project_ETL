services:
  db:
    image: postgres:15
    container_name: weather_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_db
    ports:
      - "5432:5432"
    volumes:
      - weather_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  weather_data:
